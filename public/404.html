<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect to index.html with path info in query param for React Router to handle
      var path = window.location.pathname;
      window.location.replace('/?redirect=' + path + window.location.search + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
