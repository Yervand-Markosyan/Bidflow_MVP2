    <!-- Bidflow Tracking Script -->
    <script>
    (function() {
      const BIDFLOW_API = "https://ais-pre-ntazh4dq53lpfbniqopixv-81264801679.europe-west3.run.app/api/track";
      const SESSION_START = Date.now();
      window.SESSION_START = SESSION_START;
      
      // Global metrics object with SessionStorage persistence
      window.bidflow_metrics = {
        videoStartTime: 0,
        totalVideoTime: parseFloat(sessionStorage.getItem('bf_video_time') || '0'),
        maxScroll: parseInt(sessionStorage.getItem('bf_scroll') || '0'),
        videoElement: null,
        lang: 'en',
        lastPos: -1
      };
    
      function track(eventName, properties = {}) {
        // 1. Force recalculate live metrics
        const h = document.documentElement;
        const b = document.body;
        const st = 'scrollTop';
        const sh = 'scrollHeight';
        const currentScrollPercent = Math.round((h[st] || b[st]) / ((h[sh] || b[sh]) - h.clientHeight) * 100) || 0;
        
        if (currentScrollPercent > window.bidflow_metrics.maxScroll) {
          window.bidflow_metrics.maxScroll = currentScrollPercent;
          sessionStorage.setItem('bf_scroll', window.bidflow_metrics.maxScroll);
        }
        
        let liveVideoTime = window.bidflow_metrics.totalVideoTime;
        if (window.bidflow_metrics.videoStartTime > 0) {
          liveVideoTime += (Date.now() - window.bidflow_metrics.videoStartTime) / 1000;
        }

        // 2. Prepare standardized properties (matches trackingService.ts logic)
        const SESSION_DURATION = Math.floor((Date.now() - SESSION_START) / 1000);
        const calculatedProperties = {
          email: properties.email || "",
          role: properties.role || "",
          timestamp: new Date().toISOString(),
          utm_source: getParam('utm_source') || getReferrerSource() || "",
          utm_campaign: getParam('utm_campaign') || "",
          utm_medium: getParam('utm_medium') || "",
          session_duration: SESSION_DURATION,
          scroll: Math.max(Number(window.bidflow_metrics.maxScroll), Number(properties.scroll || 0)),
          scroll_depth: Math.max(Number(window.bidflow_metrics.maxScroll), Number(properties.scroll_depth || 0)),
          video_duration: Math.max(Math.round(liveVideoTime), Number(properties.video_duration || 0)),
          video_watch_time: Math.max(Math.round(liveVideoTime), Number(properties.video_watch_time || 0)),
          device: window.innerWidth < 768 ? 'Mobile' : 'Desktop',
          language: window.bidflow_metrics.lang || properties.language || navigator.language || "en",
          url: window.location.href,
          path: window.location.pathname
        };

        const mergedProperties = { ...calculatedProperties, ...properties };

        // 3. Unify: Prefer Firestore via React's exposed trackEvent, fallback to direct API
        if (window.bidflow_trackEvent && typeof window.bidflow_trackEvent === 'function') {
           window.bidflow_trackEvent(eventName, mergedProperties);
           return; 
        }

        // Direct API fallback (for early events or if React fails)
        const event = {
          event_name: eventName,
          timestamp: new Date().toISOString(),
          session_id: getSessionId(),
          properties: mergedProperties
        };
        
        const payload = JSON.stringify(event);
        if (navigator.sendBeacon) {
          try {
            const blob = new Blob([payload], { type: 'application/json' });
            if (navigator.sendBeacon(BIDFLOW_API, blob)) return;
          } catch (e) {}
        }
        fetch(BIDFLOW_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true,
          mode: 'cors',
          credentials: 'omit'
        }).catch(() => {});
      }
    
      function getSessionId() {
        let sid = sessionStorage.getItem('bf_sid');
        if (!sid) {
          sid = 's_' + Math.random().toString(36).substr(2, 9);
          sessionStorage.setItem('bf_sid', sid);
        }
        return sid;
      }
    
      function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }
    
      function getReferrerSource() {
        const ref = document.referrer;
        if (!ref) return 'Ուղիղ';
        if (ref.includes('google.com')) return 'google';
        if (ref.includes('facebook.com')) return 'facebook';
        if (ref.includes('instagram.com')) return 'instagram';
        if (ref.includes('linkedin.com')) return 'linkedin';
        return 'Organic_Referral';
      }
    
      // Video Tracking - Multi-layer tracking for maximum reliability
      function startGlobalVideoHeartbeat() {
        if (window.videoHeartbeatStarted) return;
        window.videoHeartbeatStarted = true;
        
        console.log('Bidflow: Starting global video monitor v2.3 (Persistent & Unified)');
        
        // Layer 1: High-frequency heartbeat (500ms)
        setInterval(() => {
          const video = document.querySelector('video');
          if (!video) {
            flushVideoTime();
            return;
          }
          
          if (window.bidflow_metrics.videoElement !== video) {
            window.bidflow_metrics.videoElement = video;
          }

          const currentPos = video.currentTime;
          const isMoving = window.bidflow_metrics.lastPos !== currentPos;
          window.bidflow_metrics.lastPos = currentPos;

          if (video && !video.paused && !video.seeking && (isMoving || video.readyState >= 2)) {
            if (window.bidflow_metrics.videoStartTime === 0) {
              window.bidflow_metrics.videoStartTime = Date.now();
            } else {
              const now = Date.now();
              const delta = (now - window.bidflow_metrics.videoStartTime) / 1000;
              window.bidflow_metrics.totalVideoTime += delta;
              sessionStorage.setItem('bf_video_time', window.bidflow_metrics.totalVideoTime.toString());
              window.bidflow_metrics.videoStartTime = now;
            }
          } else {
            flushVideoTime();
          }
        }, 500);

        // Layer 2: Periodic Pings (Every 20s) - Firestore logging
        setInterval(() => {
          const totalVideo = Math.round(window.bidflow_metrics.totalVideoTime);
          if (totalVideo > 0) {
            track('video_ping', { 
              video_duration: totalVideo,
              active_watching: window.bidflow_metrics.videoStartTime > 0
            });
          }
        }, 20000);

        // Layer 3: Visibility Change
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') {
            flushVideoTime();
            const totalVideo = Math.round(window.bidflow_metrics.totalVideoTime);
            if (totalVideo > 0) {
              track('video_tab_hidden', { video_duration: totalVideo });
            }
          }
        });

        function flushVideoTime() {
          if (window.bidflow_metrics.videoStartTime > 0) {
            window.bidflow_metrics.totalVideoTime += (Date.now() - window.bidflow_metrics.videoStartTime) / 1000;
            sessionStorage.setItem('bf_video_time', window.bidflow_metrics.totalVideoTime.toString());
            window.bidflow_metrics.videoStartTime = 0;
          }
        }
      }
    
      // Scroll Tracking
      function initScrollTracking() {
        window.addEventListener('scroll', () => {
          const h = document.documentElement;
          const b = document.body;
          const st = 'scrollTop';
          const sh = 'scrollHeight';
          const scrollPercent = Math.round((h[st] || b[st]) / ((h[sh] || b[sh]) - h.clientHeight) * 100);
          if (scrollPercent > window.bidflow_metrics.maxScroll) {
            window.bidflow_metrics.maxScroll = scrollPercent;
            sessionStorage.setItem('bf_scroll', window.bidflow_metrics.maxScroll);
          }
        });
      }
    
      // Initialize systems
      startGlobalVideoHeartbeat();
      initScrollTracking();

      // Auto-track page view (Unified)
      track('script_initialized', { version: '2.3' });
      // Removed redundant page_view_landing here as App.tsx handles it now via unified trackEvent

      // Final stats on page leave - Consolidated
      window.addEventListener('beforeunload', () => {
        // Final video time update
        if (window.bidflow_metrics.videoStartTime > 0) {
          window.bidflow_metrics.totalVideoTime += (Date.now() - window.bidflow_metrics.videoStartTime) / 1000;
          window.bidflow_metrics.videoStartTime = 0;
        }

        const totalVideo = Math.round(window.bidflow_metrics.totalVideoTime);
        if (totalVideo > 2) {
          track('video_watch_time', { 
            video_duration: totalVideo,
            watched_real: true 
          });
        }
        
        if (window.bidflow_metrics.maxScroll > 5) {
          track('scroll_depth', { 
            scroll_depth: window.bidflow_metrics.maxScroll, 
            scroll: window.bidflow_metrics.maxScroll 
          });
        }

        const finalDuration = Math.floor((Date.now() - SESSION_START) / 1000);
        track('session_end', { 
          duration: finalDuration,
          duration_segment: finalDuration > 9 ? '>9s' : '<9s',
          final_scroll: window.bidflow_metrics.maxScroll,
          final_video: totalVideo
        });
      });
    
      // Global access for custom events
      window.bidflow = { 
        track,
        getVideoWatchTime: () => {
          let liveVideoTime = window.bidflow_metrics.totalVideoTime;
          if (window.bidflow_metrics.videoStartTime > 0) {
            liveVideoTime += (Date.now() - window.bidflow_metrics.videoStartTime) / 1000;
          }
          return Math.round(liveVideoTime);
        },
        // Helper for early access
        trackEarlyAccess: (email, role) => {
          track('early_access_signup', { email, role });
        },
        // Helper for supplier signup
        trackSupplier: (step, data) => {
          const events = {
            1: 'supplier_signup_started',
            2: 'supplier_materials_selected',
            3: 'supplier_pricing_entered',
            4: 'supplier_company_info_entered',
            5: 'supplier_signup_submitted'
          };
          track(events[step] || 'supplier_signup_step', data);
        },
        // Helper for buyer request
        trackBuyer: (step, data) => {
          const events = {
            1: 'material_request_started',
            2: 'material_category_selected',
            3: 'material_quantity_entered',
            4: 'project_location_entered',
            5: 'material_request_submitted'
          };
          track(events[step] || 'material_request_step', data);
        }
      };
    })();
    </script>
