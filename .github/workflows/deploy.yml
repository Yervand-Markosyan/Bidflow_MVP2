name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Կամ ձեր հիմնական ճյուղի անունը (օրինակ՝ master)

# Թույլտվությունների կարգավորում GitHub Actions-ի համար
permissions:
  contents: read
  pages: write
  id-token: write

# Կանխարգելում է միաժամանակյա կառուցումները
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm' # Ներառված է միայն այն դեպքում, երբ package-lock.json-ը միշտ առկա է

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          # Այստեղ անհրաժեշտության դեպքում կարող եք ավելացնել ձեր build-time փոփոխականները

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
