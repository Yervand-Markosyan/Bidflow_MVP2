name: Deploy Bidflow Dubai

on:
  push:
    branches:
      - main  # Կամ master, կախված ձեր հիմնական ճյուղի անունից
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Application & Package Plesk
        run: npm run build

      - name: Commit and Push Plesk Deployment base64
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bidflow_plesk_deploy.zip.base64
          git diff-index --quiet HEAD || git commit -m "chore: update Plesk deployment bundle [skip ci]"
          git push origin HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
